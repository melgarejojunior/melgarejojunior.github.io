---
layout: default
---
<article class="post"><header class="post-header"><h1 class="post-title">{{ page.title | escape }}</h1>
<p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{% if page.lang == 'pt-BR' %}{{ page.date | date: '%d/%m/%Y' }}{% else %}{{ page.date | date: '%b %-d, %Y' }}{% endif %}</time></p></header>
<div class="post-content">{{ content }}</div></article>
